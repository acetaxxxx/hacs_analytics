services:
  analyticsd:
    build:
      context: ./services/analyticsd
      dockerfile: Dockerfile
    image: ${HOMEKEEPER_IMAGE:-homekeeper-analyticsd:local}
    restart: unless-stopped
    ports:
      - "${HOMEKEEPER_PORT:-8080}:8080"
    environment:
      HOMEKEEPER_LISTEN_ADDR: ":8080"
      HOMEKEEPER_DB_PATH: /data/homekeeper.db
      HOMEKEEPER_SHARED_TOKEN: ${HOMEKEEPER_SHARED_TOKEN:?Set HOMEKEEPER_SHARED_TOKEN in .env}
      HOMEKEEPER_TIMEZONE: ${HOMEKEEPER_TIMEZONE:-Asia/Taipei}
      HOMEKEEPER_CONTRACT_MAJOR: ${HOMEKEEPER_CONTRACT_MAJOR:-1}
      HOMEKEEPER_MAX_BODY_BYTES: ${HOMEKEEPER_MAX_BODY_BYTES:-1048576}
      HOMEKEEPER_GEMINI_MODEL: ${HOMEKEEPER_GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - homekeeper-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  homekeeper-data:
