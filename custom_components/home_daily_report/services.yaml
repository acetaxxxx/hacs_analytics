generate_report:
  name: Generate report
  description: Generate a daily report through the external Gemini sidecar and optionally notify.
  fields:
    date:
      name: Date
      description: Date to report in YYYY-MM-DD format. Defaults to yesterday.
      example: "2026-06-18"
      selector:
        text:
    use_ai:
      name: Use Gemini AI
      description: Send the bounded report input to the configured Gemini sidecar.
      default: true
      selector:
        boolean:
    notify:
      name: Notify
      description: Send the resulting report to the configured notification service.
      default: true
      selector:
        boolean:
