name: Sidecar

on:
  push:
    paths:
      - "services/analyticsd/**"
      - "contracts/**"
      - ".github/workflows/sidecar.yml"
  pull_request:
    paths:
      - "services/analyticsd/**"
      - "contracts/**"
      - ".github/workflows/sidecar.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analyticsd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/analyticsd/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/analyticsd
      - run: GOOS=windows GOARCH=amd64 go build -o analyticsd.exe ./cmd/analyticsd

  contract-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse JSON schemas
        run: node -e "for (const file of ['contracts/health.schema.json','contracts/ingest-event.schema.json','contracts/report.schema.json']) JSON.parse(require('fs').readFileSync(file, 'utf8')); JSON.parse(require('fs').readFileSync('custom_components/home_daily_report/strings.json', 'utf8'));"
