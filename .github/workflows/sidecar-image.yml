name: Sidecar image

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        name: Compute image tags
        shell: bash
        run: |
          sha_tag="${GITHUB_SHA: -6}"
          if [[ ! "$sha_tag" =~ ^[0-9a-f]{6}$ ]]; then
            echo "GITHUB_SHA did not produce a six-character hexadecimal tag" >&2
            exit 1
          fi
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homekeeper-analyticsd" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/analyticsd
          file: services/analyticsd/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
          tags: ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.sha_tag }}
